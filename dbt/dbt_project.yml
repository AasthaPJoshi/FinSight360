name: finsight360
version: '1.0.0'
config-version: 2
profile: finsight360
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

models:
  finsight360:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

vars:
  start_date: '2019-01-01'
  risk_score_threshold: 60
