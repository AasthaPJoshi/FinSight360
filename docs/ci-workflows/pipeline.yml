name: Scheduled Daily Pipeline

on:
  schedule:
    - cron: "0 6 * * 1-5"   # 6am UTC, weekdays
  workflow_dispatch:
    inputs:
      ticker:
        description: "Specific ticker to ingest (leave empty for default list)"
        required: false
        default: ""

jobs:
  run-pipeline:
    name: Daily data pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get install -y build-essential libgomp1
          pip install -r requirements.txt

      - name: Setup environment
        run: |
          cp .env.example .env
          mkdir -p data/raw data/processed models mlruns \
                   reports/shap_plots docs data/raw/filings

      - name: Run ingestion
        env:
          EDGAR_USER_AGENT: "FinSight360 Pipeline pipeline@finsight360.com"
          DUCKDB_PATH: "data/finsight360.duckdb"
          LOG_LEVEL: "INFO"
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python -m finsight360.cli ingest \
              --ticker "${{ github.event.inputs.ticker }}"
          else
            python -m finsight360.cli ingest --ticker AAPL
          fi

      - name: Run ML pipeline
        env:
          DUCKDB_PATH: "data/finsight360.duckdb"
        run: |
          python -m finsight360.cli ml-run || true
          python -m finsight360.cli graph-build --skip-neo4j || true

      - name: Run governance report
        env:
          DUCKDB_PATH: "data/finsight360.duckdb"
        run: python -m finsight360.cli governance-report || true

      - name: Health check
        env:
          DUCKDB_PATH: "data/finsight360.duckdb"
        run: python -m finsight360.cli health || true

      - name: Upload DuckDB artifact
        uses: actions/upload-artifact@v4
        with:
          name: finsight360-db-${{ github.run_id }}
          path: data/finsight360.duckdb
          retention-days: 7

      - name: Upload model card
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-card-${{ github.run_id }}
          path: docs/model_card.md
